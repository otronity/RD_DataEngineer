version: 2

# Тести на Silver. Специфікація: ../../SPEC.md → «Тести».
models:
  - name: events
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: event_type
        tests:
          - accepted_values:
              values: [PushEvent, PullRequestEvent, IssuesEvent, IssueCommentEvent, WatchEvent, ForkEvent]
      - name: repo_name
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null

  - name: commits
    columns:
      - name: commit_sha
        tests:
          - not_null
          - unique

  - name: pull_requests
    columns:
      - name: state
        tests:
          - accepted_values:
              values: [open, closed]

  - name: issues
    columns:
      - name: state
        tests:
          - accepted_values:
              values: [open, closed]